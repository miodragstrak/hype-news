<!DOCTYPE html>

<html>

<head>

<link
rel="stylesheet"
href="style.css"
>

</head>

<body>

<div id="news">

</div>

<script>

fetch(
'cache/news.json'
)

.then(
r=>
r.json()
)

.then(
news=>{

document
.getElementById(
'news'
)

.innerHTML=

news
.map(
item=>

`

<a
class="card"

href="${
item.url
}"

target="_blank"

>

<img
src="${
item.image
}"
>

<h3>

${
item.title
}

</h3>

<div>

${
item.published_at
||

''
}

</div>

<div>

${
item.source
}

</div>

</a>

`

)

.join('');

});

</script>

</body>

</html>
