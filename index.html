<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hype News</title>
    <link rel="icon" href="assets/hype-logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="news-section">
        <div class="brand-mark">
            <img src="assets/hype-logo.png" alt="Hype">
        </div>

        <div class="news-header">
            <span>›</span>
            <h2>VESTI</h2>
        </div>

        <div class="banner" id="news"></div>
    </section>

    <script>
        const newsContainer = document.getElementById('news');

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, character => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            }[character]));
        }

        function renderNews(news) {
            newsContainer.innerHTML = news.map(item => `
                <a class="card" href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">
                    <div class="thumb">
                        <img src="${escapeHtml(item.image)}" alt="${escapeHtml(item.title)}">
                    </div>
                    <div class="content">
                        <h3>${escapeHtml(item.title)}</h3>
                    </div>
                </a>
            `).join('');
        }

        fetch('cache/news.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Missing cache/news.json (${response.status})`);
                }

                return response.json();
            })
            .then(renderNews)
            .catch(error => {
                console.error(error);
                newsContainer.innerHTML = '<p class="empty-state">Vesti trenutno nisu dostupne.</p>';
            });
    </script>
</body>
</html>
